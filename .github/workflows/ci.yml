name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: CLI smoke test
        run: |
          node src/cli.js --version
          node src/cli.js sbom test/fixtures/proj --name demo --out /tmp/sbom.json
          node src/cli.js sbom test/fixtures/proj --format spdx > /tmp/spdx.json
          node src/cli.js clock --since 2026-11-07T09:00:00Z
