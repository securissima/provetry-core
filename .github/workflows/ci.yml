name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: CLI smoke test
        run: |
          node src/cli.js --version
          node src/cli.js sbom test/fixtures/proj --name demo --out /tmp/sbom.json
          node src/cli.js sbom test/fixtures/proj --format spdx > /tmp/spdx.json
          node src/cli.js clock --since 2026-11-07T09:00:00Z

  action:
    # The GitHub Action itself, on the test fixtures (real OSV, KEV and EUVD lookups, nothing uploaded).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: provetry
        uses: ./
        with:
          path: test/fixtures/proj
          version: 0.0.0-ci
          reachability: "off"
      - run: test -s "${{ steps.provetry.outputs.sbom }}" && test -s "${{ steps.provetry.outputs.sarif }}"

  action-syft:
    # The action on a container image with Syft (image-tool: syft), so the pinned Syft download is exercised.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: provetry
        uses: ./
        with:
          image: alpine:3.20
          image-tool: syft
          version: 0.0.0-ci
      - run: test -s "${{ steps.provetry.outputs.sbom }}" && grep -q '"pkg:apk/alpine/' "${{ steps.provetry.outputs.sbom }}"
