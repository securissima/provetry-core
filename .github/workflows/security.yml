# CI de sécurité commune (Enigmacker/securite-ci, v1.1) : npm audit, gitleaks, osv-scanner, Semgrep, tests.
name: security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # chaque lundi, passage complet
  workflow_dispatch:
# Indispensable : c'est le plafond des droits du workflow commun, quoi que contienne une version future.
permissions:
  contents: read
jobs:
  security:
    uses: Enigmacker/securite-ci/.github/workflows/security.yml@58c817ba5a16df434f73576c6cfb44b4c009f19e # v1.1
    with:
      # Les lockfiles de test/fixtures décrivent des projets vulnérables à dessein : seul le projet lui-même est audité.
      audit-dirs: .
      # Les tests ont déjà leur propre workflow (ci.yml).
