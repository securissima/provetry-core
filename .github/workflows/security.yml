# Security CI: npm audit, gitleaks, osv-scanner and Semgrep.
# security-common.yml is a verbatim copy of the shared security workflow (v1.2): a public repository
# cannot call a private reusable workflow. Keep it byte-identical when updating it.
name: security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # every Monday, full pass
  workflow_dispatch:
# Required: the ceiling of the called workflow's permissions.
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-common.yml
    with:
      # The lock files of test/fixtures describe vulnerable projects on purpose: only the project itself is audited.
      audit-dirs: .
      # Same reason for osv-scanner; some fixtures are also unreadable on purpose (missing Maven parent,
      # missing pip include), which would make it fail.
      osv-exclude: test/fixtures
      # The tests have their own workflow (ci.yml).
