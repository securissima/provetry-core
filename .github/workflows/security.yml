# CI de sécurité commune (securissima/securite-ci-securissima, v1.2) : npm audit, gitleaks, osv-scanner, Semgrep, tests.
name: security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # chaque lundi, passage complet
  workflow_dispatch:
# Indispensable : c'est le plafond des droits du workflow commun, quoi que contienne une version future.
permissions:
  contents: read
jobs:
  security:
    uses: securissima/securite-ci-securissima/.github/workflows/security.yml@9f890c94838baedefb58775bf7eb21120b6f7756 # v1.2 (osv-exclude)
    with:
      # Les lockfiles de test/fixtures décrivent des projets vulnérables à dessein : seul le projet lui-même est audité.
      audit-dirs: .
      # Même raison pour osv-scanner ; certaines fixtures sont en plus illisibles à dessein (parent Maven
      # inexistant, include pip absent), ce qui le ferait échouer.
      osv-exclude: test/fixtures
      # Les tests ont déjà leur propre workflow (ci.yml).
