# The lock files under test/fixtures describe vulnerable projects on purpose (the tests check that
# Provetry finds and analyses them): they are never updated. The tool itself has no dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    # Une version publiée depuis moins de 7 jours n'est pas proposée (temps de repérer une version compromise).
    cooldown:
      default-days: 7
    exclude-paths:
      - "test/**"
