# Provetry for GitLab CI: SBOM, vulnerability watch and reachability (Go functions, package imports elsewhere) at every tag.
# Include it in your .gitlab-ci.yml:
#   include:
#     - remote: https://raw.githubusercontent.com/Enigmacker/provetry-core/main/ci/provetry.gitlab-ci.yml
# Variables (Settings → CI/CD → Variables): PROVETRY_API_KEY (masked, protected) and PROVETRY_PRODUCT_ID
# to upload to Provetry; PROVETRY_FAIL_ON (exploited, critical, high…) to fail the pipeline.
provetry:
  stage: test
  image: node:22-bookworm
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # Pinned to a commit (version 0.8.0): this code receives your API key. Move to a newer one deliberately.
    PROVETRY_REF: 0879d73f7b259a7fbaf9cd60f48edbb1f3ff63fa
    PROVETRY_FAIL_ON: none
    PROVETRY_APP_URL: https://app.provetry.com
  script:
    - set -euo pipefail
    - git init -q /tmp/provetry && git -C /tmp/provetry fetch -q --depth 1 https://github.com/Enigmacker/provetry-core.git "$PROVETRY_REF" && git -C /tmp/provetry checkout -q FETCH_HEAD
    - VERSION="${CI_COMMIT_TAG#v}"
    - node /tmp/provetry/src/cli.js sbom . --name "$CI_PROJECT_NAME" --version "$VERSION" --out sbom.cdx.json
    - |
      VEX=()
      if [ -n "$(find . -name go.mod -not -path '*/vendor/*' -not -path '*/testdata/*' -print -quit)" ]; then
        case "$(uname -m)" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; *) ARCH="" ;; esac
        GOV=$(curl -fsS 'https://go.dev/VERSION?m=text' | head -1 || true)
        if [ -n "$ARCH" ] && [ -n "$GOV" ] && curl -fsSL "https://go.dev/dl/${GOV}.linux-${ARCH}.tar.gz" | tar -C /usr/local -xz \
           && PATH="/usr/local/go/bin:$HOME/go/bin:$PATH" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4; then
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
        else
          echo "Go could not be installed: Go reachability skipped."
        fi
      fi
      # A partial result is safe: what could not be checked stays "under investigation".
      # reach.vex.json goes to Provetry (suggestions); the gate only relies on govulncheck's statements.
      REACH_ARGS=()
      if [ -n "${PROVETRY_API_KEY:-}" ] && [ -n "${PROVETRY_APP_URL:-}" ]; then REACH_ARGS=(--provetry-url "$PROVETRY_APP_URL"); fi
      node /tmp/provetry/src/cli.js reach . --product "pkg:generic/$CI_PROJECT_NAME@$VERSION" --out reach.vex.json --gate reach.gate.vex.json "${REACH_ARGS[@]}" || true
      [ -s reach.gate.vex.json ] && VEX=(--vex reach.gate.vex.json)
      node /tmp/provetry/src/cli.js scan sbom.cdx.json "${VEX[@]}" --format markdown --out provetry.md || true
      if [ -n "${PROVETRY_API_KEY:-}" ] && [ -n "${PROVETRY_PRODUCT_ID:-}" ]; then
        ENC=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$VERSION")
        CODE=$(curl -sS -o upload.json -w '%{http_code}' -X POST -H "Authorization: Bearer $PROVETRY_API_KEY" -H 'content-type: application/json' \
          --data-binary @sbom.cdx.json "$PROVETRY_APP_URL/api/v1/products/$PROVETRY_PRODUCT_ID/releases?version=$ENC")
        cat upload.json; echo
        if [ "$CODE" != 201 ] && ! { [ "$CODE" = 409 ] && grep -q 'already exists' upload.json; }; then echo "Provetry upload refused (HTTP $CODE)"; exit 1; fi
        if [ -s reach.vex.json ]; then
          CODE=$(curl -sS -o vex.json -w '%{http_code}' -X POST -H "Authorization: Bearer $PROVETRY_API_KEY" -H 'content-type: application/json' \
            --data-binary @reach.vex.json "$PROVETRY_APP_URL/api/v1/products/$PROVETRY_PRODUCT_ID/releases/$ENC/vex")
          cat vex.json; echo
          [ "$CODE" = 200 ] || { echo "Provetry refused the reachability results (HTTP $CODE)"; exit 1; }
        fi
      fi
      node /tmp/provetry/src/cli.js scan sbom.cdx.json "${VEX[@]}" --fail-on "$PROVETRY_FAIL_ON"
  artifacts:
    when: always
    paths: [sbom.cdx.json, reach.vex.json, provetry.md]
    expire_in: 90 days
